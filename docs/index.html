<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ADvTECH Website Status</title>
<meta name="description" content="Live availability, performance and certificate status for the ADvTECH website estate.">
<style>
  /* ---------------------------------------------------------------
     Palette roles. Light values on :root, dark redefined under both
     the OS media query and an explicit theme stamp so the toggle wins
     in both directions.
     --------------------------------------------------------------- */
  :root {
    color-scheme: light;
    --surface-0:      #f4f4f1;   /* page */
    --surface-1:      #fcfcfb;   /* cards */
    --surface-2:      #eeeeea;   /* wells, track fills */
    --border:         #dedcd6;
    --border-strong:  #c9c7bf;

    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #83817a;

    --good:           #0ca30c;
    --warning:        #fab219;
    --serious:        #ec835a;
    --critical:       #d03b3b;

    --series-1:       #2a78d6;
    --series-dim:     #b7d3f6;

    --good-wash:      #0ca30c1f;
    --warning-wash:   #fab2192e;
    --critical-wash:  #d03b3b1f;

    --shadow: 0 1px 2px #0b0b0b0f, 0 4px 12px #0b0b0b0a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0:      #121211;
      --surface-1:      #1a1a19;
      --surface-2:      #24241f;
      --border:         #34342e;
      --border-strong:  #4a4a42;

      --text-primary:   #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted:     #8f8e83;

      --series-1:       #3987e5;
      --series-dim:     #1c5cab;

      --good-wash:      #0ca30c26;
      --warning-wash:   #fab21926;
      --critical-wash:  #d03b3b26;

      --shadow: 0 1px 2px #00000040, 0 4px 12px #00000030;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-0:      #121211;
    --surface-1:      #1a1a19;
    --surface-2:      #24241f;
    --border:         #34342e;
    --border-strong:  #4a4a42;

    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #8f8e83;

    --series-1:       #3987e5;
    --series-dim:     #1c5cab;

    --good-wash:      #0ca30c26;
    --warning-wash:   #fab21926;
    --critical-wash:  #d03b3b26;

    --shadow: 0 1px 2px #00000040, 0 4px 12px #00000030;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--surface-0);
    color: var(--text-primary);
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1360px; margin: 0 auto; padding: 24px 20px 64px; }

  /* ---------------- header ---------------- */
  header.top {
    display: flex; flex-wrap: wrap; gap: 16px;
    align-items: baseline; justify-content: space-between;
    margin-bottom: 20px;
  }
  h1 { font-size: 19px; font-weight: 650; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--text-secondary); font-size: 13px; margin-top: 2px; }
  .head-actions { display: flex; align-items: center; gap: 10px; }
  button.ghost {
    background: var(--surface-1); color: var(--text-secondary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 6px 11px; font: inherit; font-size: 13px; cursor: pointer;
  }
  button.ghost:hover { border-color: var(--border-strong); color: var(--text-primary); }

  /* ---------------- hero ---------------- */
  .hero {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px 24px; margin-bottom: 16px;
    box-shadow: var(--shadow);
    display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between;
  }
  .hero-figure { font-size: 48px; font-weight: 660; line-height: 1.05; letter-spacing: -0.02em; }
  .hero-note { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
  .hero-left { display: flex; align-items: center; gap: 18px; }
  .hero-mark { width: 14px; height: 56px; border-radius: 4px; background: var(--good); flex: none; }

  /* ---------------- banners ---------------- */
  .banner {
    border-radius: 10px; padding: 11px 14px; margin-bottom: 16px;
    font-size: 14px; display: flex; gap: 10px; align-items: flex-start;
    border: 1px solid var(--border);
  }
  .banner.warn     { background: var(--warning-wash);  border-color: #fab21966; }
  .banner.critical { background: var(--critical-wash); border-color: #d03b3b66; }
  .banner b { font-weight: 620; }

  /* ---------------- stat tiles ---------------- */
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(158px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow);
  }
  .tile .label { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
  .tile .value { font-size: 27px; font-weight: 640; margin-top: 3px; letter-spacing: -0.015em; }
  .tile .foot  { font-size: 12px; color: var(--text-muted); margin-top: 1px; }

  /* ---------------- filters ---------------- */
  .filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
  input[type="search"], select {
    background: var(--surface-1); color: var(--text-primary);
    border: 1px solid var(--border); border-radius: 8px;
    padding: 7px 10px; font: inherit; font-size: 13px;
  }
  input[type="search"] { min-width: 230px; }
  input[type="search"]:focus-visible, select:focus-visible, button:focus-visible {
    outline: 2px solid var(--series-1); outline-offset: 1px;
  }
  .spacer { flex: 1 1 auto; }
  .count { font-size: 13px; color: var(--text-muted); }

  /* ---------------- table ---------------- */
  .card {
    background: var(--surface-1); border: 1px solid var(--border);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; margin-bottom: 22px;
  }
  .card > h2 {
    font-size: 14px; font-weight: 620; margin: 0;
    padding: 13px 16px; border-bottom: 1px solid var(--border);
  }
  .card > h2 .muted { color: var(--text-muted); font-weight: 450; }
  .scroll { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th {
    font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-muted); font-weight: 600; background: var(--surface-1);
    position: sticky; top: 0; z-index: 1; cursor: pointer; user-select: none;
  }
  th:hover { color: var(--text-secondary); }
  th[aria-sort] { color: var(--text-primary); }
  tbody tr:hover { background: var(--surface-2); }
  tbody tr:last-child td { border-bottom: none; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--series-1); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .site-name { font-weight: 560; }
  .site-brand { color: var(--text-muted); font-size: 12px; }

  /* Status pill: colored dot + written label, so colour is never the only cue. */
  .pill { display: inline-flex; align-items: center; gap: 6px; font-weight: 560; font-size: 12.5px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .s-up       .dot { background: var(--good); }
  .s-degraded .dot { background: var(--warning); }
  .s-down     .dot { background: var(--critical); }
  .s-down { color: var(--critical); font-weight: 640; }

  .reason { color: var(--text-secondary); font-size: 12.5px; white-space: normal; min-width: 190px; }
  .cert-crit { color: var(--critical); font-weight: 600; }
  .cert-warn { font-weight: 600; }

  .spark { display: block; }
  .empty { padding: 34px 16px; text-align: center; color: var(--text-muted); font-size: 14px; }

  /* ---------------- tooltip ---------------- */
  #tip {
    position: fixed; z-index: 50; pointer-events: none; opacity: 0;
    transition: opacity .09s; background: var(--surface-1);
    border: 1px solid var(--border-strong); border-radius: 8px;
    padding: 7px 10px; font-size: 12.5px; box-shadow: var(--shadow);
    max-width: 260px; color: var(--text-primary);
  }
  #tip .t-label { color: var(--text-secondary); }

  footer { color: var(--text-muted); font-size: 12.5px; text-align: center; margin-top: 30px; }
  @media (max-width: 640px) {
    .hero-figure { font-size: 36px; }
    .hero-mark { height: 44px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div>
      <h1>ADvTECH Website Status</h1>
      <div class="sub" id="subtitle">Loading…</div>
    </div>
    <div class="head-actions">
      <button class="ghost" id="themeBtn" type="button" aria-label="Toggle colour theme">Theme</button>
      <button class="ghost" id="refreshBtn" type="button">Refresh</button>
    </div>
  </header>

  <div id="banners"></div>

  <section class="hero" aria-labelledby="heroLabel">
    <div class="hero-left">
      <div class="hero-mark" id="heroMark"></div>
      <div>
        <div class="hero-figure" id="heroFigure">—</div>
        <div class="hero-note" id="heroLabel">Checking…</div>
      </div>
    </div>
    <div style="min-width:240px">
      <svg id="estateSpark" class="spark" width="240" height="52" role="img"
           aria-label="Estate-wide availability over the recent window"></svg>
      <div class="hero-note" style="font-size:12px" id="estateSparkLabel"></div>
    </div>
  </section>

  <section class="tiles" id="tiles"></section>

  <div class="filters">
    <input type="search" id="q" placeholder="Search site or brand…" aria-label="Search sites">
    <select id="fDivision" aria-label="Filter by division"><option value="">All divisions</option></select>
    <select id="fState" aria-label="Filter by state">
      <option value="">All states</option>
      <option value="down">Down only</option>
      <option value="degraded">Degraded only</option>
      <option value="notup">Down + degraded</option>
      <option value="up">Healthy only</option>
    </select>
    <div class="spacer"></div>
    <span class="count" id="rowCount"></span>
  </div>

  <div class="card">
    <div class="scroll">
      <table id="grid">
        <thead>
          <tr>
            <th data-sort="state">Status</th>
            <th data-sort="site">Site</th>
            <th data-sort="division">Division</th>
            <th data-sort="ms" class="num">Response</th>
            <th>Recent</th>
            <th data-sort="uptime" class="num">Uptime</th>
            <th data-sort="cert" class="num">Cert</th>
            <th data-sort="reason">Detail</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="empty" id="gridEmpty" hidden>No sites match those filters.</div>
  </div>

  <div class="card">
    <h2>Recent incidents <span class="muted" id="incCount"></span></h2>
    <div class="scroll">
      <table>
        <thead>
          <tr><th>Site</th><th>Started</th><th>Ended</th><th class="num">Duration</th><th>Cause</th></tr>
        </thead>
        <tbody id="incRows"></tbody>
      </table>
    </div>
    <div class="empty" id="incEmpty" hidden>No incidents recorded.</div>
  </div>

  <footer>
    Checked automatically by GitHub Actions · <span id="footNote"></span>
  </footer>
</div>

<div id="tip" role="tooltip"></div>

<script>
(function () {
  'use strict';

  var STALE_MULTIPLIER = 3;      // flag data as stale after N expected intervals
  var AUTO_REFRESH_MS  = 60000;

  var state = { status: null, recent: null, incidents: [], sort: 'state', dir: 1 };

  // ---------------------------------------------------------- theme
  var themeBtn = document.getElementById('themeBtn');
  var saved = null;
  try { saved = localStorage.getItem('status-theme'); } catch (e) {}
  if (saved) document.documentElement.setAttribute('data-theme', saved);

  themeBtn.addEventListener('click', function () {
    var cur = document.documentElement.getAttribute('data-theme');
    var isDark = cur ? cur === 'dark'
                     : window.matchMedia('(prefers-color-scheme: dark)').matches;
    var next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('status-theme', next); } catch (e) {}
    render();
  });

  // ---------------------------------------------------------- helpers
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function ago(iso) {
    if (!iso) return 'never';
    var mins = Math.round((Date.now() - Date.parse(iso)) / 60000);
    if (mins < 1)   return 'just now';
    if (mins === 1) return '1 minute ago';
    if (mins < 60)  return mins + ' minutes ago';
    var hrs = Math.round(mins / 60);
    if (hrs === 1)  return '1 hour ago';
    if (hrs < 48)   return hrs + ' hours ago';
    return Math.round(hrs / 24) + ' days ago';
  }

  function fmtTime(iso) {
    if (!iso) return '—';
    var d = new Date(iso);
    return d.toLocaleString(undefined, { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  }

  function fmtDur(mins) {
    if (mins == null) return 'ongoing';
    if (mins < 60) return mins + 'm';
    var h = Math.floor(mins / 60), m = mins % 60;
    return h + 'h' + (m ? ' ' + m + 'm' : '');
  }

  // Median gap between checks, used to judge whether the data has gone stale.
  function intervalMinutes() {
    var pts = state.recent && state.recent.points;
    if (!pts || pts.length < 3) return 15;
    var gaps = [];
    for (var i = 1; i < pts.length; i++) {
      gaps.push((Date.parse(pts[i]) - Date.parse(pts[i - 1])) / 60000);
    }
    gaps.sort(function (a, b) { return a - b; });
    return Math.max(1, Math.round(gaps[Math.floor(gaps.length / 2)]));
  }

  function uptimeFor(site) {
    var series = state.recent && state.recent.series && state.recent.series[site];
    if (!series || !series.length) return null;
    var seen = 0, ok = 0;
    for (var i = 0; i < series.length; i++) {
      seen++;
      if (series[i] !== null) ok++;
    }
    return seen ? ok / seen : null;
  }

  // ---------------------------------------------------------- tooltip
  var tip = document.getElementById('tip');
  function showTip(html, x, y) {
    tip.innerHTML = html;
    tip.style.opacity = '1';
    var r = tip.getBoundingClientRect();
    var left = Math.min(x + 12, window.innerWidth - r.width - 8);
    var top  = y - r.height - 12;
    if (top < 8) top = y + 16;
    tip.style.left = Math.max(8, left) + 'px';
    tip.style.top = top + 'px';
  }
  function hideTip() { tip.style.opacity = '0'; }

  // ---------------------------------------------------------- sparkline
  // Single series, so no legend: the column header names it. Outage points are
  // drawn as critical-coloured ticks rather than simply being absent.
  function sparkline(svg, values, labels, opts) {
    opts = opts || {};
    var w = +svg.getAttribute('width'), h = +svg.getAttribute('height');
    var padY = 4;
    var nums = values.filter(function (v) { return v !== null && v !== undefined; });

    while (svg.firstChild) svg.removeChild(svg.firstChild);
    if (!nums.length) {
      var none = document.createElementNS('http://www.w3.org/2000/svg', 'text');
      none.setAttribute('x', 0); none.setAttribute('y', h / 2 + 4);
      none.setAttribute('fill', 'var(--text-muted)');
      none.setAttribute('font-size', '11');
      none.textContent = 'no data yet';
      svg.appendChild(none);
      return;
    }

    var max = Math.max.apply(null, nums), min = Math.min.apply(null, nums);
    if (max === min) { max = max + 1; min = Math.max(0, min - 1); }
    var n = values.length;
    var xAt = function (i) { return n === 1 ? w / 2 : (i / (n - 1)) * w; };
    var yAt = function (v) { return h - padY - ((v - min) / (max - min)) * (h - padY * 2); };

    var ns = 'http://www.w3.org/2000/svg';
    var segments = [], cur = [];
    for (var i = 0; i < n; i++) {
      if (values[i] === null || values[i] === undefined) {
        if (cur.length) { segments.push(cur); cur = []; }
        var tick = document.createElementNS(ns, 'rect');
        tick.setAttribute('x', Math.max(0, xAt(i) - 1));
        tick.setAttribute('y', 0);
        tick.setAttribute('width', 2);
        tick.setAttribute('height', h);
        tick.setAttribute('fill', 'var(--critical)');
        tick.setAttribute('opacity', '0.85');
        svg.appendChild(tick);
      } else {
        cur.push([xAt(i), yAt(values[i])]);
      }
    }
    if (cur.length) segments.push(cur);

    segments.forEach(function (seg) {
      if (seg.length === 1) {
        var d = document.createElementNS(ns, 'circle');
        d.setAttribute('cx', seg[0][0]); d.setAttribute('cy', seg[0][1]); d.setAttribute('r', 1.6);
        d.setAttribute('fill', 'var(--series-1)');
        svg.appendChild(d);
        return;
      }
      var p = document.createElementNS(ns, 'polyline');
      p.setAttribute('fill', 'none');
      p.setAttribute('stroke', 'var(--series-1)');
      p.setAttribute('stroke-width', '2');
      p.setAttribute('stroke-linejoin', 'round');
      p.setAttribute('stroke-linecap', 'round');
      p.setAttribute('points', seg.map(function (q) { return q[0] + ',' + q[1]; }).join(' '));
      svg.appendChild(p);
    });

    // Transparent hit strip - hover targets are wider than the 2px line.
    var hit = document.createElementNS(ns, 'rect');
    hit.setAttribute('x', 0); hit.setAttribute('y', 0);
    hit.setAttribute('width', w); hit.setAttribute('height', h);
    hit.setAttribute('fill', 'transparent');
    hit.style.cursor = 'crosshair';
    svg.appendChild(hit);

    var marker = document.createElementNS(ns, 'circle');
    marker.setAttribute('r', '3.5');
    marker.setAttribute('fill', 'var(--series-1)');
    marker.setAttribute('stroke', 'var(--surface-1)');
    marker.setAttribute('stroke-width', '2');
    marker.setAttribute('opacity', '0');
    svg.appendChild(marker);

    svg.addEventListener('mousemove', function (ev) {
      var box = svg.getBoundingClientRect();
      var rel = (ev.clientX - box.left) / box.width;
      var idx = Math.max(0, Math.min(n - 1, Math.round(rel * (n - 1))));
      var v = values[idx];
      var when = labels && labels[idx] ? fmtTime(labels[idx]) : '';
      if (v === null || v === undefined) {
        marker.setAttribute('opacity', '0');
        showTip('<b>Down</b><div class="t-label">' + esc(when) + '</div>', ev.clientX, ev.clientY);
      } else {
        marker.setAttribute('cx', xAt(idx));
        marker.setAttribute('cy', yAt(v));
        marker.setAttribute('opacity', '1');
        showTip('<b>' + v + ' ms</b><div class="t-label">' + esc(when) + '</div>', ev.clientX, ev.clientY);
      }
    });
    svg.addEventListener('mouseleave', function () { marker.setAttribute('opacity', '0'); hideTip(); });
  }

  // ---------------------------------------------------------- rendering
  function render() {
    var s = state.status;
    if (!s) return;

    var interval = intervalMinutes();
    var ageMin = (Date.now() - Date.parse(s.generatedAt)) / 60000;
    var stale = ageMin > interval * STALE_MULTIPLIER;

    document.getElementById('subtitle').textContent =
      s.total + ' sites · checked ' + ago(s.generatedAt) + ' · every ~' + interval + ' min';
    document.getElementById('footNote').textContent =
      'Last run ' + fmtTime(s.generatedAt) + ' · page refreshes itself every minute';

    // --- banners ---
    var banners = [];
    if (stale) {
      banners.push('<div class="banner critical"><b>⚠ Data is stale.</b> The last successful check was ' +
        esc(ago(s.generatedAt)) + ', but checks are expected every ~' + interval +
        ' minutes. The monitoring workflow may have stopped — everything below could be out of date.</div>');
    }
    if (s.down > 0) {
      var names = s.sites.filter(function (x) { return x.state === 'down'; })
                         .map(function (x) { return x.site; }).join(', ');
      banners.push('<div class="banner critical"><b>✕ ' + s.down + ' site' + (s.down > 1 ? 's' : '') +
        ' down:</b> ' + esc(names) + '</div>');
    }
    var expiring = s.sites.filter(function (x) { return x.cert && x.cert.days != null && x.cert.days <= 21; });
    if (expiring.length) {
      expiring.sort(function (a, b) { return a.cert.days - b.cert.days; });
      banners.push('<div class="banner warn"><b>⚠ ' + expiring.length +
        ' certificate' + (expiring.length > 1 ? 's' : '') + ' expiring within 21 days:</b> ' +
        esc(expiring.map(function (x) { return x.site + ' (' + x.cert.days + 'd)'; }).join(', ')) + '</div>');
    }
    document.getElementById('banners').innerHTML = banners.join('');

    // --- hero (exactly one hero figure on the page) ---
    var heroFig, heroLabel, heroColor;
    if (s.down > 0) {
      heroFig = s.down + ' down'; heroColor = 'var(--critical)';
      heroLabel = 'of ' + s.total + ' sites — needs attention now';
    } else if (s.degraded > 0) {
      heroFig = s.degraded + ' degraded'; heroColor = 'var(--warning)';
      heroLabel = 'of ' + s.total + ' sites — reachable, but something is off';
    } else {
      heroFig = 'All ' + s.total + ' up'; heroColor = 'var(--good)';
      heroLabel = 'Every monitored site is responding normally';
    }
    document.getElementById('heroFigure').textContent = heroFig;
    document.getElementById('heroFigure').style.color = heroColor;
    document.getElementById('heroLabel').textContent = heroLabel;
    document.getElementById('heroMark').style.background = heroColor;

    // --- estate sparkline: how many sites were up at each check ---
    var pts = (state.recent && state.recent.points) || [];
    var series = (state.recent && state.recent.series) || {};
    var keys = Object.keys(series);
    var upCounts = pts.map(function (_, i) {
      var c = 0;
      for (var k = 0; k < keys.length; k++) if (series[keys[k]][i] !== null && series[keys[k]][i] !== undefined) c++;
      return c;
    });
    sparkline(document.getElementById('estateSpark'), upCounts, pts);
    document.getElementById('estateSparkLabel').textContent =
      pts.length ? 'Sites responding · last ' + pts.length + ' checks' : 'Trend builds up as checks run';

    // --- tiles ---
    var allUptimes = keys.map(uptimeFor).filter(function (v) { return v !== null; });
    var estateUptime = allUptimes.length
      ? allUptimes.reduce(function (a, b) { return a + b; }, 0) / allUptimes.length : null;
    var responded = s.sites.filter(function (x) { return typeof x.ms === 'number' && x.state !== 'down'; })
                           .map(function (x) { return x.ms; }).sort(function (a, b) { return a - b; });
    var median = responded.length ? responded[Math.floor(responded.length / 2)] : null;
    var slowest = s.sites.filter(function (x) { return typeof x.ms === 'number'; })
                         .sort(function (a, b) { return b.ms - a.ms; })[0];
    var minCert = s.sites.filter(function (x) { return x.cert && x.cert.days != null; })
                         .sort(function (a, b) { return a.cert.days - b.cert.days; })[0];
    var openInc = state.incidents.filter(function (i) { return !i.endedAt; }).length;

    var tiles = [
      { label: 'Healthy',        value: s.up,       foot: 'of ' + s.total + ' sites' },
      { label: 'Degraded',       value: s.degraded, foot: 'reachable, with issues' },
      { label: 'Down',           value: s.down,     foot: openInc ? openInc + ' open incident' + (openInc > 1 ? 's' : '') : 'no open incidents' },
      { label: 'Availability',   value: estateUptime == null ? '—' : (estateUptime * 100).toFixed(2) + '%',
        foot: pts.length ? 'across last ' + pts.length + ' checks' : 'building history' },
      { label: 'Median response', value: median == null ? '—' : median + ' ms',
        foot: slowest ? 'slowest ' + slowest.site.replace(/^www\./, '') : '' },
      { label: 'Next cert expiry', value: minCert ? minCert.cert.days + ' d' : '—',
        foot: minCert ? minCert.site : '' },
    ];
    document.getElementById('tiles').innerHTML = tiles.map(function (t) {
      return '<div class="tile"><div class="label">' + esc(t.label) + '</div>' +
             '<div class="value">' + esc(t.value) + '</div>' +
             '<div class="foot">' + esc(t.foot) + '</div></div>';
    }).join('');

    renderGrid();
    renderIncidents();
  }

  var STATE_RANK = { down: 0, degraded: 1, up: 2 };

  function renderGrid() {
    var s = state.status;
    var q = document.getElementById('q').value.trim().toLowerCase();
    var fDiv = document.getElementById('fDivision').value;
    var fState = document.getElementById('fState').value;

    var rows = s.sites.filter(function (x) {
      if (q && (x.site + ' ' + (x.brand || '') + ' ' + (x.division || '')).toLowerCase().indexOf(q) === -1) return false;
      if (fDiv && x.division !== fDiv) return false;
      if (fState === 'notup' && x.state === 'up') return false;
      if (fState && fState !== 'notup' && x.state !== fState) return false;
      return true;
    });

    var dir = state.dir, key = state.sort;
    rows.sort(function (a, b) {
      var av, bv;
      switch (key) {
        case 'state':    av = STATE_RANK[a.state]; bv = STATE_RANK[b.state]; break;
        case 'ms':       av = a.ms == null ? Infinity : a.ms; bv = b.ms == null ? Infinity : b.ms; break;
        case 'uptime':   av = uptimeFor(a.site); bv = uptimeFor(b.site);
                         av = av == null ? 2 : av; bv = bv == null ? 2 : bv; break;
        case 'cert':     av = a.cert && a.cert.days != null ? a.cert.days : Infinity;
                         bv = b.cert && b.cert.days != null ? b.cert.days : Infinity; break;
        case 'division': av = a.division || ''; bv = b.division || ''; break;
        case 'reason':   av = a.reason || ''; bv = b.reason || ''; break;
        default:         av = a.site; bv = b.site;
      }
      if (av < bv) return -1 * dir;
      if (av > bv) return 1 * dir;
      return a.site.localeCompare(b.site);
    });

    document.getElementById('rowCount').textContent =
      rows.length === s.sites.length ? s.sites.length + ' sites'
                                     : rows.length + ' of ' + s.sites.length + ' sites';

    var tbody = document.getElementById('rows');
    tbody.innerHTML = rows.map(function (x, i) {
      var up = uptimeFor(x.site);
      var certCls = '', certTxt = '—';
      if (x.cert && x.cert.days != null) {
        certTxt = x.cert.days + ' d';
        if (x.cert.days <= 14) certCls = 'cert-crit';
        else if (x.cert.days <= 30) certCls = 'cert-warn';
      }
      var label = x.state === 'up' ? 'Up' : x.state === 'degraded' ? 'Degraded' : 'Down';
      var redirectNote = x.redirected
        ? '<div class="site-brand">→ ' + esc(x.finalUrl.replace(/^https?:\/\//, '').replace(/\/$/, '')) + '</div>'
        : '';
      return '<tr>' +
        '<td><span class="pill s-' + x.state + '"><span class="dot"></span>' + label + '</span></td>' +
        '<td><a href="' + esc(x.url) + '" target="_blank" rel="noopener noreferrer" class="site-name">' +
          esc(x.site) + '</a>' +
          '<div class="site-brand">' + esc(x.brand || '') + '</div>' + redirectNote + '</td>' +
        '<td>' + esc(x.division || '') + '</td>' +
        '<td class="num">' + (x.ms == null ? '—' : x.ms + ' ms') + '</td>' +
        '<td><svg class="spark" data-site="' + esc(x.site) + '" width="110" height="26" role="img" ' +
          'aria-label="Response time trend for ' + esc(x.site) + '"></svg></td>' +
        '<td class="num">' + (up == null ? '—' : (up * 100).toFixed(1) + '%') + '</td>' +
        '<td class="num ' + certCls + '">' + certTxt + '</td>' +
        '<td class="reason">' + esc(x.reason || '') + '</td>' +
      '</tr>';
    }).join('');

    document.getElementById('gridEmpty').hidden = rows.length > 0;

    var pts = (state.recent && state.recent.points) || [];
    tbody.querySelectorAll('svg[data-site]').forEach(function (svg) {
      var name = svg.getAttribute('data-site');
      var vals = (state.recent && state.recent.series && state.recent.series[name]) || [];
      sparkline(svg, vals, pts);
    });

    document.querySelectorAll('#grid th[data-sort]').forEach(function (th) {
      if (th.getAttribute('data-sort') === state.sort) {
        th.setAttribute('aria-sort', state.dir === 1 ? 'ascending' : 'descending');
      } else {
        th.removeAttribute('aria-sort');
      }
    });
  }

  function renderIncidents() {
    var inc = state.incidents.slice(0, 40);
    document.getElementById('incCount').textContent =
      state.incidents.length ? '(' + state.incidents.length + ' recorded)' : '';
    document.getElementById('incEmpty').hidden = inc.length > 0;
    document.getElementById('incRows').innerHTML = inc.map(function (i) {
      return '<tr>' +
        '<td class="site-name">' + esc(i.site) + '</td>' +
        '<td>' + esc(fmtTime(i.startedAt)) + '</td>' +
        '<td>' + (i.endedAt ? esc(fmtTime(i.endedAt)) :
          '<span class="pill s-down"><span class="dot"></span>Ongoing</span>') + '</td>' +
        '<td class="num">' + esc(fmtDur(i.minutes)) + '</td>' +
        '<td class="reason">' + esc(i.reason || '') + '</td>' +
      '</tr>';
    }).join('');
  }

  // ---------------------------------------------------------- data loading
  async function load() {
    var bust = '?t=' + Date.now();   // Pages caches aggressively; always ask for fresh JSON
    var get = async function (path, fallback) {
      try {
        var res = await fetch(path + bust, { cache: 'no-store' });
        if (!res.ok) throw new Error(res.status + ' ' + res.statusText);
        return await res.json();
      } catch (e) {
        return fallback;
      }
    };

    var status = await get('data/status.json', null);
    if (!status) {
      document.getElementById('subtitle').textContent = 'Could not load status data.';
      document.getElementById('heroFigure').textContent = 'No data';
      document.getElementById('heroLabel').textContent =
        'data/status.json is missing or unreadable. If the repository was only just created, ' +
        'the first monitoring run may not have finished yet.';
      return;
    }
    state.status    = status;
    state.recent    = await get('data/recent.json', { points: [], series: {} });
    state.incidents = await get('data/incidents.json', []);

    var sel = document.getElementById('fDivision');
    if (sel.options.length <= 1) {
      var divs = Array.from(new Set(status.sites.map(function (x) { return x.division; })
                                                .filter(Boolean))).sort();
      divs.forEach(function (d) {
        var o = document.createElement('option');
        o.value = d; o.textContent = d;
        sel.appendChild(o);
      });
    }
    render();
  }

  // ---------------------------------------------------------- wiring
  document.getElementById('q').addEventListener('input', renderGrid);
  document.getElementById('fDivision').addEventListener('change', renderGrid);
  document.getElementById('fState').addEventListener('change', renderGrid);
  document.getElementById('refreshBtn').addEventListener('click', load);

  document.querySelectorAll('#grid th[data-sort]').forEach(function (th) {
    th.addEventListener('click', function () {
      var key = th.getAttribute('data-sort');
      if (state.sort === key) state.dir = -state.dir;
      else { state.sort = key; state.dir = 1; }
      renderGrid();
    });
  });

  load();
  setInterval(load, AUTO_REFRESH_MS);
})();
</script>
</body>
</html>
